<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Smart Card</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      padding: 30px 15px;
    }

    .card {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
    }

    .profile {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #666;
    }

    a {
      display: block;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="card">

    <img class="profile"
         src="https://via.placeholder.com/110"
         alt="Profile photo">

    <h1>YOUR NAME</h1>

    <p>Digital Creator</p>

    <a href="YOUR_TIKTOK_LINK">🎵 TikTok</a>

    <a href="YOUR_INSTAGRAM_LINK">📸 Instagram</a>

    <a href="YOUR_FACEBOOK_LINK">📘 Facebook</a>

    <a href="YOUR_WHATSAPP_LINK">💬 WhatsApp</a>

  </div>

</body>
</html>
